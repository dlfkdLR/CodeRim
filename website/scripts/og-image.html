<!doctype html>
<html lang="ko"><meta charset="utf-8">
<title>CodeRim social card (1200x630)</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #F4F3EF; color: #181A1E; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; word-break: keep-all; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
  .brand img { width: 84px; height: 84px; }
  .brand span { font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
  h1 { margin: 0; font-size: 50px; line-height: 1.22; font-weight: 800; letter-spacing: -1.2px; }
  p { margin: 26px 0 0; font-size: 27px; line-height: 1.4; color: #4A4D55; }
  .tags { margin-top: 34px; display: flex; gap: 12px; }
  .tags b { font-size: 22px; font-weight: 600; padding: 8px 18px; border-radius: 999px; background: #181A1E; color: #F4F3EF; }
  .card { position: absolute; filter: drop-shadow(0 18px 30px rgba(24,26,30,.28)); }
  .codex { left: 650px; top: 36px; height: 480px; }
  .claude { left: 750px; top: 128px; height: 480px; }
</style>
<div class="copy">
  <div class="brand"><img src="../assets/coderim.svg" alt=""><span>CodeRim</span></div>
  <h1>Codex·Claude Code 사용량과 한도를 화면 가장자리에서</h1>
  <p>Keep AI coding usage in sight.</p>
  <div class="tags"><b>macOS</b><b>Windows</b><b>무료 오픈 소스</b></div>
</div>
<img class="card codex" src="../assets/screens/codex-combined.png" alt="">
<img class="card claude" src="../assets/screens/claude-combined.png" alt="">
</html>
