[package]
name = "coderim-usage-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "CodeRim's token accounting and cumulative usage normalization"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["bridge", "cli", "widget", "windows-cli"]
resolver = "3"

# This installed process has a bounded input and fixed-size output buffers. It
# uses Darwin's process entry and system allocator without the Rust std runtime.
[profile.status-line]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"
