[package]
name = "coderim-accounting-bridge"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
coderim-usage-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(target_os = "macos")'.dependencies]
memchr = "2"
