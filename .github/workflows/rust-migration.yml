name: Rust migration parity

on:
  push:
    branches: [migration/full-rust]
  pull_request:
    paths:
      - 'Rust/**'
      - 'Scripts/rust_migration/**'
      - 'Scripts/build_release.sh'
      - 'Scripts/package_release.sh'
      - 'Scripts/make_dmg.sh'
      - 'Sources/CodeRimUsageCore/**'
      - 'Sources/CodeRim/Domain/SourceCheckpoint.swift'
      - 'Sources/CodeRim/Notch/SideNotchShape.swift'
      - 'Sources/CodeRim/Notch/NotchRootView.swift'
      - 'Sources/CodeRim/Notch/NotchLayout.swift'
      - 'Sources/CodeRim/App/UsageDisplayPolicy.swift'
      - 'Sources/CodeRim/Profile/ProfileUsageStore.swift'
      - 'Sources/CodeRim/Settings/Panes/UsageAnalyticsPresentation.swift'
      - 'Sources/CodeRim/Pricing/**'
      - 'Tests/CodeRimTests/FullAuditBoundaryTests.swift'
      - 'Sources/CodeRim/Persistence/**'
      - 'Sources/CodeRim/Sources/SourceImportSession.swift'
      - 'Windows/Directory.Build.targets'
      - 'Windows/Scripts/package*.ps1'
      - 'Windows/Scripts/test-installer.ps1'
      - 'Windows/src/CodeRim.UsageCore/**'
      - 'Windows/tests/CodeRim.UsageCore.Tests/**'
      - 'Tests/CodeRimTests/MobileSnapshotTests.swift'
      - 'Sources/CodeRim/Services/MobileConnectionStore.swift'
      - 'Sources/CodeRimShared/Mobile*.swift'
      - 'iOS/**'
      - 'MobileRelay/**'
      - 'Tests/Fixtures/**'
      - '.github/workflows/rust-migration.yml'

permissions:
  contents: read

concurrency:
  group: rust-migration-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mobile-contracts:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Replay local SQLite relay and retained desktop snapshot
        run: node --test MobileRelay/test/*.test.mjs
      - name: Verify iPhone wire, lifecycle and dashboard compatibility
        shell: bash
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r,ds in devices.items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")))')"
          xcodebuild test -project iOS/CodeRimMobile.xcodeproj -scheme CodeRimMobile \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -only-testing:CodeRimMobileTests \
            -only-testing:CodeRimMobileUITests/MobileUITests/testIdleDashboardKeepsUsageAndLetsThePersonChooseAComputer \
            -only-testing:CodeRimMobileUITests/MobileUITests/testHomeScreenOffersToPairWhenEmptyAndShowsTheRelayNotice \
            -derivedDataPath "$RUNNER_TEMP/ios-migration" -resultBundlePath "$RUNNER_TEMP/ios-migration-tests.xcresult" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-migration-tests
          path: ${{ runner.temp }}/ios-migration-tests.xcresult
          if-no-files-found: warn

  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --release

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - run: python3 Scripts/rust_migration/apple.py check
      - name: Check the Rust CLI on the native host
        run: |
          cargo clippy --locked --manifest-path Rust/cli/Cargo.toml --features macos-companion --all-targets -- -D warnings
          cargo build --locked --release --manifest-path Rust/cli/Cargo.toml --features macos-companion
          python3 Tests/Scripts/companion_cli_tests.py Rust/target/release/CodeRimCLI

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Verify native host and build Rust DLL
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne '${{ matrix.arch }}') { throw 'Unexpected OS architecture' }
          if ((dotnet --info | Out-String) -notmatch 'Architecture:\s+${{ matrix.arch }}\b') { throw 'Unexpected .NET host architecture' }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path Rust/Cargo.toml --target ${{ matrix.target }} --release -p coderim-accounting-bridge
      - name: Reject wrong-architecture bridge at build and publish time
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bridge_arch_test.py --architecture ${{ matrix.arch }} --library "$library"
      - name: Run native baseline
        run: dotnet test Windows/tests/CodeRim.UsageCore.Tests --configuration Release
      - name: Run Rust host and differential tests
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.UsageCore.Tests --configuration Release -p:CodeRimRustAccounting=true "-p:CodeRimRustAccountingLibrary=$library"

      - name: Run product's .NET regression suite with the Rust host
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.Core.Tests --configuration Release -p:CodeRimRustAccounting=true "-p:CodeRimRustAccountingLibrary=$library"
      - name: Preserve product test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-test-results
          path: Windows/tests/**/TestResults/*.log
          if-no-files-found: warn
      - name: Check out the stable Windows data reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 14c332b30fd35cd266b40a4f9384b4b065b63707 # v2.1.41
          path: .migration-oracle
          persist-credentials: false
      - name: Verify application data across release, candidate and rollback
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/check_windows_data_rollback.py --stable-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-data-rollback.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-data-rollback
          path: windows-${{ matrix.arch }}-data-rollback.json
          if-no-files-found: error
      - name: Compare native and Rust throughput on this architecture
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --output "windows-${{ matrix.arch }}-normalization.json"
      - name: Compare native and Rust period aggregation on this architecture
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --workload aggregate --output "windows-${{ matrix.arch }}-aggregate.json"
      - name: Compare canonical and mixed Windows token parsing
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --workload parse-tokens --output "windows-${{ matrix.arch }}-parse-tokens.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Scripts/rust_migration/windows_bench.py --library "$library" --workload parse-mixed --output "windows-${{ matrix.arch }}-parse-mixed.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-normalization
          path: |
            windows-${{ matrix.arch }}-normalization.json
            windows-${{ matrix.arch }}-aggregate.json
            windows-${{ matrix.arch }}-parse-*.json
          if-no-files-found: error

  macos-tests:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: rust-migration-tests
      - name: Run Swift package, generated provider suites and CLI with Rust enabled
        env:
          CODERIM_RUN_STRESS_TESTS: '1'
          CODERIM_ACCOUNT_CAPTURE_DIR: ${{ runner.temp }}/account-layout
        run: python3 Scripts/rust_migration/apple.py test

  macos-bundle:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: rust-migration-release
      - name: Build universal ad-hoc migration bundle
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python3 Scripts/rust_migration/apple.py app "$RUNNER_TEMP/rust-app"
          app="$RUNNER_TEMP/rust-app/CodeRim.app"
          lipo "$app/Contents/MacOS/CodeRim" -verify_arch arm64
          lipo "$app/Contents/MacOS/CodeRim" -verify_arch x86_64
          codesign --verify --strict --deep "$app"
          cmp Rust/THIRD-PARTY-NOTICES.txt "$app/Contents/Resources/Rust-Notices.txt"
          cmp Rust/cli/THIRD-PARTY-NOTICES.txt "$app/Contents/Resources/Rust-CLI-Notices.txt"

      - name: Verify offline install from the release ZIP and DMG
        run: python3 Scripts/rust_migration/check_macos_package.py "$RUNNER_TEMP/rust-app/CodeRim.app" "$RUNNER_TEMP/migration-packages"
      - name: Reopen published usage data across upgrade, rollback and backup replay
        run: |
          reference="$RUNNER_TEMP/published-v2.1.41"
          mkdir "$reference"
          cd "$reference"
          curl --fail --location --silent --show-error --retry 2 --output reference.zip \
            https://github.com/dlfkdLR/CodeRim/releases/download/v2.1.41/CodeRim-2.1.41.zip
          echo '4ac0af13250c2517683f3dd423df612db04a496913625cfea4021b19a0d4cf78  reference.zip' | shasum -a 256 -c -
          ditto -x -k reference.zip .
          python3 "$GITHUB_WORKSPACE/Scripts/rust_migration/check_macos_data_rollback.py" \
            "$reference/CodeRim.app" "$RUNNER_TEMP/rust-app/CodeRim.app" "$RUNNER_TEMP/migration-packages/rollback.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-migration-installation
          path: |
            ${{ runner.temp }}/migration-packages/verified.json
            ${{ runner.temp }}/migration-packages/rollback.json
          if-no-files-found: error

  windows-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            triple: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build ZIP, MSI and MSIX migration packages
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne '${{ matrix.arch }}') { throw 'Unexpected OS architecture' }
          rustup target add ${{ matrix.triple }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path Rust/Cargo.toml --release --target ${{ matrix.triple }} -p coderim-accounting-bridge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $library = (Resolve-Path 'Rust/target/${{ matrix.triple }}/release/coderim_accounting_bridge.dll').Path
          ./Windows/Scripts/package.ps1 -RuntimeIdentifier win-${{ matrix.arch }} -RustAccountingLibrary $library -ResetManifest
          ./Windows/Scripts/package-installer.ps1 -RuntimeIdentifier win-${{ matrix.arch }}
          ./Windows/Scripts/package-msix.ps1 -RuntimeIdentifier win-${{ matrix.arch }}
      - name: Compare archived Rust files to build inputs and exercise the ZIP CLI
        run: |
          $archive = Get-Item 'Artifacts/CodeRim-Windows-*-${{ matrix.arch }}.zip'
          $expected = ((Get-Content ($archive.FullName + '.sha256') -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive.FullName).Hash -ne $expected) { throw 'ZIP checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'coderim-migration-zip'
          Expand-Archive $archive.FullName $dest
          $library = 'Rust/target/${{ matrix.triple }}/release/coderim_accounting_bridge.dll'
          $sidecars = @{'coderim_accounting_bridge.dll' = $library; 'Rust-Notices.txt' = 'Rust/THIRD-PARTY-NOTICES.txt'}
          foreach ($name in $sidecars.Keys) {
            if ((Get-FileHash (Join-Path $dest $name)).Hash -ne (Get-FileHash $sidecars[$name]).Hash) { throw "ZIP payload mismatch: $name" }
          }
          python Windows/tests/cli_regression_tests.py (Join-Path $dest 'CodeRimCLI.exe')
      - name: Exercise MSI installation, rollback, repair and removal
        run: |
          dotnet build Windows/tests/CodeRim.ProcessFixture --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Get-Item 'Artifacts/CodeRim-Windows-*-${{ matrix.arch }}-Setup.msi'
          ./Windows/Scripts/test-installer.ps1 -Architecture ${{ matrix.arch }} -Installer $setup.FullName -VerifyRustAccounting
      - name: Install, activate and remove the Store candidate
        shell: powershell
        run: |
          $package = Get-Item 'Artifacts/CodeRim-Windows-*-${{ matrix.arch }}.msix'
          ./Windows/Scripts/test-msix.ps1 -Package $package.FullName -Architecture ${{ matrix.arch }}
          $outcome = Get-Content Artifacts/msix-${{ matrix.arch }}/msix-checks.json -Raw | ConvertFrom-Json
          if ($outcome -notcontains 'packaged-native-ui-smoke') { throw 'The runner did not exercise packaged GUI activation.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-${{ matrix.arch }}-migration-installation
          path: |
            Artifacts/*.sha256
            Artifacts/windows-msi-lifecycle.json
            Artifacts/installed/**/*.json
            Artifacts/installed/**/*.png
            Artifacts/msix-*/msix-checks.json
            Artifacts/msix-*/*.png
          if-no-files-found: warn
