name: Rust migration parity

on:
  push:
    branches: [migration/full-rust]
  pull_request:
    paths:
      - 'Rust/**'
      - 'Scripts/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Windows/**'
      - 'iOS/**'
      - 'MobileRelay/**'
      - 'WidgetExtension/**'
      - 'Config/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/rust-migration.yml'

permissions:
  contents: read

concurrency:
  group: rust-migration-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mobile-contracts:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Replay local SQLite relay and retained desktop snapshot
        run: node --test MobileRelay/test/*.test.mjs
      - name: Build the Rust iOS app and simulator archives
        shell: bash
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.2"
          CARGO_TARGET_DIR: ${{ runner.temp }}/mobile-rust
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build --manifest-path Rust/Cargo.toml --locked --release --package coderim-accounting-bridge --target "$target"
          done
          lipo -create "$CARGO_TARGET_DIR/aarch64-apple-ios-sim/release/libcoderim_accounting_bridge.a" \
            "$CARGO_TARGET_DIR/x86_64-apple-ios/release/libcoderim_accounting_bridge.a" \
            -output "$CARGO_TARGET_DIR/libcoderim_mobile_simulator.a"
          xcodebuild build -project iOS/CodeRimMobile.xcodeproj -scheme CodeRimMobile \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" \
            -xcconfig iOS/Config/RustMobile.xcconfig CODE_SIGNING_ALLOWED=NO \
            CODERIM_MOBILE_RUST_ARCHIVE="$CARGO_TARGET_DIR/aarch64-apple-ios/release/libcoderim_accounting_bridge.a"
      - name: Replay opt-in relay quick picker and capture local timings
        run: |
          rustup target add wasm32-unknown-unknown
          bash Scripts/rust_migration/relay-picker/build.sh
          node Scripts/rust_migration/relay-picker/check.mjs "$RUNNER_TEMP/relay-picker.json"
          git fetch --no-tags --depth=1 origin refs/tags/v2.1.41:refs/tags/v2.1.41
          node Scripts/rust_migration/relay-read/check.mjs > "$RUNNER_TEMP/relay-read.json"
          node Scripts/rust_migration/relay-starter/check.mjs
      - name: Compare mobile activity, dashboard and registration behavior with the released iPhone app
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mobile-rust
        run: |
          cargo build --manifest-path Rust/Cargo.toml --locked --release --package coderim-accounting-bridge
          for policy in mobile-follow mobile-refresh mobile-registration; do
            python3 "Scripts/rust_migration/$policy/check.py" --arch "$(uname -m)" \
              --archive "$CARGO_TARGET_DIR/release/libcoderim_accounting_bridge.a"
          done
      - name: Replay both Worker entry points on local SQLite Durable Objects
        run: |
          npm install --prefix "$RUNNER_TEMP/relay-runtime" --no-audit --no-fund miniflare@5.20261123.1-beta
          node Scripts/rust_migration/relay-picker/check-worker.mjs "$RUNNER_TEMP/relay-runtime"
          node Scripts/rust_migration/relay-starter/check-worker.mjs "$RUNNER_TEMP/relay-runtime"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-picker-replay
          path: |
            ${{ runner.temp }}/relay-picker.json
            ${{ runner.temp }}/relay-read.json
          if-no-files-found: error
      - name: Verify iPhone wire, lifecycle and dashboard compatibility
        shell: bash
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r,ds in devices.items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")))')"
          # XCTest can see the app hierarchy while the simulator still displays the boot screen.
          xcrun simctl bootstatus "$device" -b
          xcodebuild test -project iOS/CodeRimMobile.xcodeproj -scheme CodeRimMobile \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -only-testing:CodeRimMobileTests \
            -only-testing:CodeRimMobileUITests/MobileUITests/testIdleDashboardKeepsUsageAndLetsThePersonChooseAComputer \
            -only-testing:CodeRimMobileUITests/MobileUITests/testHomeScreenOffersToPairWhenEmptyAndShowsTheRelayNotice \
            -derivedDataPath "$RUNNER_TEMP/ios-migration" -resultBundlePath "$RUNNER_TEMP/ios-migration-tests.xcresult" \
            -xcconfig iOS/Config/RustMobile.xcconfig \
            CODERIM_MOBILE_RUST_ARCHIVE="$RUNNER_TEMP/mobile-rust/libcoderim_mobile_simulator.a" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-migration-tests
          path: ${{ runner.temp }}/ios-migration-tests.xcresult
          if-no-files-found: warn

  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --release

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Fetch and verify the published v2.1.41 comparison baseline
        run: |
          git fetch --depth=1 --no-tags origin refs/tags/v2.1.41:refs/tags/v2.1.41
          test "$(git rev-parse 'refs/tags/v2.1.41^{commit}')" = 14c332b30fd35cd266b40a4f9384b4b065b63707
      - run: python3 Scripts/rust_migration/apple.py check
      - name: Check the Rust CLI on the native host
        run: |
          cargo clippy --locked --manifest-path Rust/cli/Cargo.toml --features macos-companion --all-targets -- -D warnings
          cargo build --locked --release --manifest-path Rust/cli/Cargo.toml --features macos-companion
          python3 Tests/Scripts/companion_cli_tests.py Rust/target/release/CodeRimCLI

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Verify native host and build Rust DLL
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne '${{ matrix.arch }}') { throw 'Unexpected OS architecture' }
          if ((dotnet --info | Out-String) -notmatch 'Architecture:\s+${{ matrix.arch }}\b') { throw 'Unexpected .NET host architecture' }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path Rust/Cargo.toml --target ${{ matrix.target }} --release -p coderim-accounting-bridge
      - name: Verify owned Windows accounts using synthetic device authorization and DPAPI
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-owned-accounts/check.py --library "$library" --rid "win-${{ matrix.arch }}" --output "windows-${{ matrix.arch }}-owned-accounts.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-owned-accounts
          path: windows-${{ matrix.arch }}-owned-accounts.json
          if-no-files-found: error
      - name: Build and compare the opt-in standalone Windows companion
        run: |
          cargo build --locked --manifest-path Rust/Cargo.toml --release --target ${{ matrix.target }} -p coderim-windows-companion --features comparison-hosts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/CodeRimRustCLI.exe').Path
          python Scripts/rust_migration/windows-standalone/check.py --binary "$exe" --rid "win-${{ matrix.arch }}" --synthetic-hook-install --output "windows-${{ matrix.arch }}-standalone.json" --artifacts "windows-${{ matrix.arch }}-standalone"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-standalone-qa
          path: |
            windows-${{ matrix.arch }}-standalone.json
            windows-${{ matrix.arch }}-standalone/
          if-no-files-found: error
      - name: Reject wrong-architecture bridge at build and publish time
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bridge_arch_test.py --architecture ${{ matrix.arch }} --library "$library"
      - name: Run native baseline
        run: dotnet test Windows/tests/CodeRim.UsageCore.Tests --configuration Release
      - name: Run Rust host and differential tests
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.UsageCore.Tests --configuration Release -p:CodeRimRustAccounting=true "-p:CodeRimRustAccountingLibrary=$library"

      - name: Verify RPC pipe cleanup and exact process ownership
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.Core.Tests --configuration Release '-p:CodeRimRustAccounting=true' "-p:CodeRimRustAccountingLibrary=$library" -- --filter-class '*AppServerIORegressionTests'
      - name: Run product's .NET regression suite with the Rust host
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.Core.Tests --configuration Release -p:CodeRimRustAccounting=true "-p:CodeRimRustAccountingLibrary=$library"
      - name: Preserve product test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-test-results
          path: Windows/tests/**/TestResults/*.log
          if-no-files-found: warn
      - name: Check out the stable Windows data reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 14c332b30fd35cd266b40a4f9384b4b065b63707 # v2.1.41
          path: .migration-oracle
          persist-credentials: false
      - name: Verify application data across release, candidate and rollback
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/check_windows_data_rollback.py --stable-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-data-rollback.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-data-rollback
          path: windows-${{ matrix.arch }}-data-rollback.json
          if-no-files-found: error
      - name: Compare native WPF notch outlines and rendering
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-notch-outline/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-notch-outline.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-notch-outline
          path: windows-${{ matrix.arch }}-notch-outline.json
          if-no-files-found: error
      - name: Compare Windows durable event writes across release and migration builds
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-event-save/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-event-save.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-event-save
          path: windows-${{ matrix.arch }}-event-save.json
          if-no-files-found: error
      - name: Compare complete release and Rust mobile snapshots on native Windows
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Windows/tests/CodeRim.MobileSnapshotProbe/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-mobile-sessions.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-mobile-sessions
          path: windows-${{ matrix.arch }}-mobile-sessions.json
          if-no-files-found: error
      - name: Compare SQLite-backed analytics costs and session lists with the release
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-model-cost/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-model-cost.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-model-cost
          path: windows-${{ matrix.arch }}-model-cost.json
          if-no-files-found: error
      - name: Compare Claude sessions and Codex attachments with the release
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-claude-events/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-claude-events.json"
          python Scripts/rust_migration/windows-scanner-sessions/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-scanner-sessions.json"
          python Scripts/rust_migration/windows-codex-attachments/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-codex-attachments.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-scanner-sessions
          path: |
            windows-${{ matrix.arch }}-claude-events.json
            windows-${{ matrix.arch }}-scanner-sessions.json
            windows-${{ matrix.arch }}-codex-attachments.json
          if-no-files-found: error
      - name: Compare bounded Windows stream reads with the release
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-bounded-lines/check.py --reference-source .migration-oracle --library "$library" --output "windows-${{ matrix.arch }}-bounded-lines.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-bounded-lines
          path: windows-${{ matrix.arch }}-bounded-lines.json
          if-no-files-found: error
      - name: Compare Settings session names and project detail names with the released WPF views
        run: python Scripts/rust_migration/windows-session-names/check.py --reference-source .migration-oracle --output "windows-${{ matrix.arch }}-session-names.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-session-names
          path: windows-${{ matrix.arch }}-session-names.json
          if-no-files-found: error
      - name: Compare native and Rust throughput on this architecture
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --output "windows-${{ matrix.arch }}-normalization.json"
      - name: Compare native and Rust period aggregation on this architecture
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --workload aggregate --output "windows-${{ matrix.arch }}-aggregate.json"
      - name: Compare the Settings chart legend and day stacks
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-settings-chart/check.py --library "$library" --benchmark-output "windows-${{ matrix.arch }}-settings-chart.json"
      - name: Compare complete daily, model and session Settings history
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-settings-history/check.py --library "$library" --output "windows-${{ matrix.arch }}-settings-history.json"
      - name: Compare tray session history totals
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-session-totals/check.py --library "$library" --benchmark-output "windows-${{ matrix.arch }}-session-totals.json"
      - name: Compare offline Windows CLI output and snapshot performance
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-cli/check.py --library "$library" --output "windows-${{ matrix.arch }}-offline-cli.json"
      - name: Compare retained SQLite history and rollback
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-sqlite/check.py --library "$library" --output "windows-${{ matrix.arch }}-sqlite.json"
      - name: Compare canonical and mixed Windows token parsing
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --workload parse-tokens --output "windows-${{ matrix.arch }}-parse-tokens.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Scripts/rust_migration/windows_bench.py --library "$library" --workload parse-mixed --output "windows-${{ matrix.arch }}-parse-mixed.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-normalization
          path: |
            windows-${{ matrix.arch }}-normalization.json
            windows-${{ matrix.arch }}-settings-chart.json
            windows-${{ matrix.arch }}-settings-history.json
            windows-${{ matrix.arch }}-sqlite.json
            windows-${{ matrix.arch }}-offline-cli.json
            windows-${{ matrix.arch }}-session-totals.json
            windows-${{ matrix.arch }}-aggregate.json
            windows-${{ matrix.arch }}-parse-*.json
          if-no-files-found: error

  macos-tests:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: rust-migration-tests
      - name: Run Swift package, generated provider suites and CLI with Rust enabled
        env:
          CODERIM_RUN_STRESS_TESTS: '1'
          CODERIM_ACCOUNT_CAPTURE_DIR: ${{ runner.temp }}/account-layout
        run: python3 Scripts/rust_migration/apple.py test

  macos-bundle:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: rust-migration-release
      - name: Build universal ad-hoc migration bundle
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python3 Scripts/rust_migration/apple.py app "$RUNNER_TEMP/rust-app"
          app="$RUNNER_TEMP/rust-app/CodeRim.app"
          lipo "$app/Contents/MacOS/CodeRim" -verify_arch arm64
          lipo "$app/Contents/MacOS/CodeRim" -verify_arch x86_64
          codesign --verify --strict --deep "$app"
          cmp Rust/THIRD-PARTY-NOTICES.txt "$app/Contents/Resources/Rust-Notices.txt"
          cmp Rust/cli/THIRD-PARTY-NOTICES.txt "$app/Contents/Resources/Rust-CLI-Notices.txt"

      - name: Verify offline install from the release ZIP and DMG
        id: package
        run: python3 Scripts/rust_migration/check_macos_package.py --require-rust-widget --require-restart-helper "$RUNNER_TEMP/rust-app/CodeRim.app" "$RUNNER_TEMP/migration-packages"
      - name: Observe the production update restart callback and bounded AppKit veto
        run: |
          git fetch --no-tags --depth=1 origin 14c332b30fd35cd266b40a4f9384b4b065b63707
          app="$RUNNER_TEMP/rust-app/CodeRim.app"
          python3 Scripts/rust_migration/restart-contract/check.py --frameworks "$app/Contents/Frameworks" \
            --helper "$app/Contents/Helpers/CodeRimRestart" --veto-timeout --output "$RUNNER_TEMP/migration-packages/restart.json"
      - name: Reopen published usage data across upgrade, rollback and backup replay
        run: |
          reference="$RUNNER_TEMP/published-v2.1.41"
          mkdir "$reference"
          cd "$reference"
          curl --fail --location --silent --show-error --retry 2 --output reference.zip \
            https://github.com/dlfkdLR/CodeRim/releases/download/v2.1.41/CodeRim-2.1.41.zip
          echo '4ac0af13250c2517683f3dd423df612db04a496913625cfea4021b19a0d4cf78  reference.zip' | shasum -a 256 -c -
          ditto -x -k reference.zip .
          python3 "$GITHUB_WORKSPACE/Scripts/rust_migration/check_macos_data_rollback.py" \
            "$reference/CodeRim.app" "$RUNNER_TEMP/rust-app/CodeRim.app" "$RUNNER_TEMP/migration-packages/rollback.json"
      - name: Preserve verified test installers for this commit
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-migration-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/migration-packages/*.zip
            ${{ runner.temp }}/migration-packages/*.dmg
            ${{ runner.temp }}/migration-packages/SHA256SUMS.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: macos-migration-installation
          path: |
            ${{ runner.temp }}/migration-packages/verified.json
            ${{ runner.temp }}/migration-packages/rollback.json
            ${{ runner.temp }}/migration-packages/restart.json
          if-no-files-found: error

  windows-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            triple: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build ZIP, MSI and MSIX migration packages
        id: packages
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne '${{ matrix.arch }}') { throw 'Unexpected OS architecture' }
          rustup target add ${{ matrix.triple }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./Windows/Scripts/package.ps1 -RuntimeIdentifier win-${{ matrix.arch }} -ResetManifest
          ./Windows/Scripts/package-installer.ps1 -RuntimeIdentifier win-${{ matrix.arch }}
          ./Windows/Scripts/package-msix.ps1 -RuntimeIdentifier win-${{ matrix.arch }}
      - name: Compare archived Rust files to build inputs and exercise the ZIP CLI
        run: |
          $archive = Get-Item 'Artifacts/CodeRim-Windows-*-${{ matrix.arch }}.zip'
          $expected = ((Get-Content ($archive.FullName + '.sha256') -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive.FullName).Hash -ne $expected) { throw 'ZIP checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'coderim-migration-zip'
          Expand-Archive $archive.FullName $dest
          $library = 'Rust/target/${{ matrix.triple }}/release/coderim_accounting_bridge.dll'
          $sidecars = @{
            'coderim_accounting_bridge.dll' = $library
            'CodeRimCLI.exe' = 'Rust/target/${{ matrix.triple }}/release/CodeRimRustCLI.exe'
            'Rust-Notices.txt' = 'Rust/THIRD-PARTY-NOTICES.txt'
            'Rust-CLI-Notices.txt' = 'Rust/windows-cli/THIRD-PARTY-NOTICES.txt'
          }
          foreach ($name in $sidecars.Keys) {
            if ((Get-FileHash (Join-Path $dest $name)).Hash -ne (Get-FileHash $sidecars[$name]).Hash) { throw "ZIP payload mismatch: $name" }
          }
          $inventory = foreach ($file in @($archive) + @(Get-Item 'Artifacts/*-${{ matrix.arch }}-Setup.msi', 'Artifacts/*-${{ matrix.arch }}.msix')) {
            [ordered]@{name=$file.Name; bytes=$file.Length; sha256=(Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant()}
          }
          $inputs = foreach ($name in @('CodeRimCLI.exe','CodeRimCLIHost.exe','coderim_accounting_bridge.dll','Rust-CLI-Notices.txt','Rust-Notices.txt')) {
            $file = Get-Item -LiteralPath (Join-Path $dest $name)
            [ordered]@{name=$name; bytes=$file.Length; sha256=(Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant(); fileVersion=$file.VersionInfo.FileVersion}
          }
          [ordered]@{commit=$env:GITHUB_SHA; architecture='${{ matrix.arch }}'; packages=@($inventory); zipPayload=@($inputs)} |
            ConvertTo-Json -Depth 5 | Set-Content 'Artifacts/windows-rust-package.json'
          python Windows/tests/cli_regression_tests.py --owned-accounts (Join-Path $dest 'CodeRimCLI.exe')
      - name: Compare cold compatibility commands and verify the updater signing dependency
        run: |
          $publish = Join-Path $PWD 'Windows/artifacts/publish/win-${{ matrix.arch }}'
          $library = (Resolve-Path 'Rust/target/${{ matrix.triple }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows-cli-host-size/check.py --public (Join-Path $publish 'CodeRimCLI.exe') --companion-host (Join-Path $publish 'CodeRimCLIHost.exe') --rid win-${{ matrix.arch }} --library $library --output 'Artifacts/windows-cli-host-size.json'
      - name: Exercise MSI installation, rollback, repair and removal
        run: |
          dotnet build Windows/tests/CodeRim.ProcessFixture --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Get-Item 'Artifacts/CodeRim-Windows-*-${{ matrix.arch }}-Setup.msi'
          $captureProbe = Join-Path $env:RUNNER_TEMP 'coderim-window-capture-probe'
          dotnet build Windows/tests/CodeRim.WindowCapture -c Release -o $captureProbe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./Windows/Scripts/test-installer.ps1 -Architecture ${{ matrix.arch }} -Installer $setup.FullName -VerifyRustAccounting -VerifyLatestPublicUpgrade -WindowCaptureProbe (Join-Path $captureProbe 'CodeRim.WindowCapture.dll')
      - name: Install, activate and remove the Store candidate
        shell: powershell
        run: |
          $package = Get-Item 'Artifacts/CodeRim-Windows-*-${{ matrix.arch }}.msix'
          ./Windows/Scripts/test-msix.ps1 -Package $package.FullName -Architecture ${{ matrix.arch }} -OwnedAccounts
          $outcome = Get-Content Artifacts/msix-${{ matrix.arch }}/msix-checks.json -Raw | ConvertFrom-Json
          if ($outcome -notcontains 'packaged-native-ui-smoke') { throw 'The runner did not exercise packaged GUI activation.' }
      - name: Check out the stable WPF account history fixture
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 14c332b30fd35cd266b40a4f9384b4b065b63707 # v2.1.41
          path: .migration-display-oracle
      - name: Compare stable and candidate native WPF views
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.triple }}/release/coderim_accounting_bridge.dll').Path
          $probeDirectory = Join-Path $env:RUNNER_TEMP 'coderim-window-capture-probe'
          $probe = Join-Path $probeDirectory 'CodeRim.WindowCapture.dll'
          if (!(Test-Path -LiteralPath $probe)) {
            dotnet build Windows/tests/CodeRim.WindowCapture -c Release -o $probeDirectory
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python Windows/tests/CodeRim.WindowCapture/source_pair.py --arch ${{ matrix.arch }} --reference-source .migration-display-oracle --library "$library" --probe "$probe" --output "Artifacts/windows-source-frame-pair.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-${{ matrix.arch }}-migration-installation
          path: |
            Artifacts/*.sha256
            Artifacts/windows-msi-lifecycle.json
            Artifacts/windows-rust-package.json
            Artifacts/windows-cli-host-size.json
            Artifacts/windows-source-frame-pair.json
            Artifacts/windows-public-msi-*.json
            Artifacts/windows-installed-cli-*.json
            Artifacts/installed/**/*.json
            Artifacts/installed/**/*.png
            Artifacts/msix-*/msix-checks.json
            Artifacts/msix-*/windows-owned-connection-settings.json
            Artifacts/msix-*/*.screen.png.capture.json
            Artifacts/msix-*/*.png
          if-no-files-found: warn
