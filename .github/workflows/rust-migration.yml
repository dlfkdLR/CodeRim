name: Rust migration parity

on:
  push:
    branches: [migration/full-rust]
  pull_request:
    paths:
      - 'Rust/**'
      - 'Scripts/rust_migration/**'
      - 'Scripts/build_release.sh'
      - 'Sources/CodeRimUsageCore/**'
      - 'Sources/CodeRim/Domain/SourceCheckpoint.swift'
      - 'Sources/CodeRim/Persistence/**'
      - 'Sources/CodeRim/Sources/SourceImportSession.swift'
      - 'Windows/Directory.Build.targets'
      - 'Windows/src/CodeRim.UsageCore/**'
      - 'Windows/tests/CodeRim.UsageCore.Tests/**'
      - 'Tests/Fixtures/**'
      - '.github/workflows/rust-migration.yml'

permissions:
  contents: read

concurrency:
  group: rust-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --release

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - run: python3 Scripts/rust_migration/apple.py check

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Verify native host and build Rust DLL
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne '${{ matrix.arch }}') { throw 'Unexpected OS architecture' }
          if ((dotnet --info | Out-String) -notmatch 'Architecture:\s+${{ matrix.arch }}\b') { throw 'Unexpected .NET host architecture' }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path Rust/Cargo.toml --target ${{ matrix.target }} --release -p coderim-accounting-bridge
      - name: Reject wrong-architecture bridge at build and publish time
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bridge_arch_test.py --architecture ${{ matrix.arch }} --library "$library"
      - name: Run native baseline
        run: dotnet test Windows/tests/CodeRim.UsageCore.Tests --configuration Release
      - name: Run Rust host and differential tests
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.UsageCore.Tests --configuration Release -p:CodeRimRustAccounting=true "-p:CodeRimRustAccountingLibrary=$library"

      - name: Run product's .NET regression suite with the Rust host
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          dotnet test Windows/tests/CodeRim.Core.Tests --configuration Release -p:CodeRimRustAccounting=true "-p:CodeRimRustAccountingLibrary=$library"
      - name: Preserve product test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-test-results
          path: Windows/tests/**/TestResults/*.log
          if-no-files-found: warn
      - name: Compare native and Rust throughput on this architecture
        run: |
          $library = (Resolve-Path 'Rust/target/${{ matrix.target }}/release/coderim_accounting_bridge.dll').Path
          python Scripts/rust_migration/windows_bench.py --library "$library" --output "windows-${{ matrix.arch }}-normalization.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-normalization
          path: windows-${{ matrix.arch }}-normalization.json
          if-no-files-found: error

  macos-tests:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: rust-migration-tests
      - name: Run Swift package, generated provider suites and CLI with Rust enabled
        env:
          CODERIM_ACCOUNT_CAPTURE_DIR: ${{ runner.temp }}/account-layout
        run: python3 Scripts/rust_migration/apple.py test

  macos-bundle:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: rust-migration-release
      - name: Build universal ad-hoc migration bundle
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python3 Scripts/rust_migration/apple.py app "$RUNNER_TEMP/rust-app"
          app="$RUNNER_TEMP/rust-app/CodeRim.app"
          lipo "$app/Contents/MacOS/CodeRim" -verify_arch arm64
          lipo "$app/Contents/MacOS/CodeRim" -verify_arch x86_64
          codesign --verify --strict --deep "$app"
          python3 Tests/Scripts/companion_cli_tests.py "$app/Contents/Helpers/CodeRimCLI"
