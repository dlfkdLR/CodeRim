name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      apple: ${{ steps.changes.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Apple build inputs
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash Scripts/ci_apple_changes.sh "$BASE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate docs, generated site and relay
        run: |
          python3 Scripts/validate_docs.py
          python3 Tests/Scripts/docs_validation_tests.py
          python3 Tests/Scripts/ci_source_mtimes_tests.py
          python3 Tests/Scripts/ci_apple_changes_tests.py
          python3 website/scripts/sync-providers.py --check
          node --check website/app.js
          node --check website/providers.js
          node --test MobileRelay/test/*.test.mjs
          python3 website/scripts/test-language.py

  build-and-test:
    needs: checks
    if: needs.checks.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: tests
      - name: Swift version
        run: swift --version
      - name: Prepare pinned dependency fixes
        run: python3 Scripts/prepare_swift_dependencies.py
      - name: Dependency patch regression tests
        run: python3 Tests/Scripts/swift_dependency_patch_tests.py
      - name: Unit and integration tests
        env:
          CODERIM_ACCOUNT_CAPTURE_DIR: ${{ github.workspace }}/.impeccable/review/accounts
        run: python3 Scripts/prepare_swift_dependencies.py --run-swift test --skip 'ProviderFetchMatrixTests|ProviderAddFlowMatrixTests' -Xswiftc -warnings-as-errors
      - name: Provider matrices (one test per provider and situation)
        run: |
          bundle="$(find .build -type d \( -name CodeRimPackageTests.xctest -o -name CodeRimTests.xctest \) -prune -print 2>/dev/null | head -1)"
          test -n "$bundle"
          # Run dynamic suites once, including toolchains whose SwiftPM discovery omits them.
          xcrun xctest -XCTest CodeRimTests.ProviderFetchMatrixTests "$bundle"
          xcrun xctest -XCTest CodeRimTests.ProviderAddFlowMatrixTests "$bundle"
      - name: Upload synthetic account layout captures on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-account-layouts
          path: .impeccable/review/accounts/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Companion CLI integration tests
        run: |
          product_directory=$(python3 Scripts/prepare_swift_dependencies.py --show-bin-path -c debug)
          python3 Tests/Scripts/companion_cli_tests.py "${product_directory}/CodeRimCLI"
          python3 Tests/Scripts/rebrand_cli_tests.py
      - name: Validate release scripts
        run: |
          zsh -n Scripts/*.sh Tests/Scripts/*.zsh
          for test_script in Tests/Scripts/*_tests.zsh; do
            "$test_script"
          done
      - name: Save source timestamps for incremental builds
        run: python3 Scripts/ci_source_mtimes.py save

  ios-tests:
    needs: checks
    if: needs.checks.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: iPhone app unit tests (simulator, ad-hoc signed)
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcodebuild test -project iOS/CodeRimMobile.xcodeproj -scheme CodeRimMobile \
            -destination "platform=iOS Simulator,id=${device}" -only-testing:CodeRimMobileTests \
            -derivedDataPath .build/ios CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tail -40
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

  release-build:
    needs: checks
    if: needs.checks.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/swift-cache
        with:
          variant: release
      - name: Universal release build
        env:
          CODERIM_SWIFT_SCRATCH_PATH: ${{ github.workspace }}/.build/coderim-build
        run: Scripts/build_release.sh
      - name: Verify architectures
        run: |
          product_directory=$(python3 Scripts/prepare_swift_dependencies.py --show-bin-path -c release --arch arm64 --arch x86_64)
          architectures=$(lipo -archs "${product_directory}/CodeRim")
          echo "$architectures"
          grep -q arm64 <<< "$architectures"
          grep -q x86_64 <<< "$architectures"
      - name: Save source timestamps for incremental builds
        run: python3 Scripts/ci_source_mtimes.py save
